<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Login - Quiz Master</title>
    <link rel="stylesheet" href="style.css">
</head>
COMPLETE<body>
    <header>
        <div class="logo">
            Quiz Master
        </div>
        <nav>
            <a href="index.html">
                Home
            </a>
        </nav>
    </header>
    <main class="login-page">
        <div class="login-box">
            <h1>
                Login
            </h1>
            <p>
                Login to start your quiz
            </p>
            <form id="loginForm">
                <!-- Username -->
                <div class="input-group">
                    <label for="username">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                    >
                    <small id="usernameError"></small>
                </div>
                <!-- Password -->
                <div class="input-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >
                    <small id="passwordError"></small>
                </div>
                <p id="loginError"></p>
                <button type="submit">
                    Login
                </button>
            </form>
            <div class="demo-login">
            </div>
        </div>
    </main>
    <footer>
        <p>
            © 2026 Quiz Master
        </p>
    </footer>
    <script src="login.js"></script>
</body>
</html>
